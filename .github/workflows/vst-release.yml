# Build Euclidier into a DRAFT release (euclidier-vst-v<version>) with mpc-vst-plugins' shared workflow:
# Actions -> "VST release (draft)" -> Run workflow. dry_run (default on) builds the zip and skin
# previews as run artifacts only. mpc-vst-plugins now lives at open-mpc/mpc-vst-plugins (moved from sd88me):
# pinned to one commit in BOTH places (uses:@ and tools_ref), as its vst-release.yml asks.
name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.2.0
        required: true
        default: 1.2.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  euclidier:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@db0ca3fa7593bddbd604c9e59c373964dc6be6ff
    permissions:
      contents: write
    with:
      tag: euclidier-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: db0ca3fa7593bddbd604c9e59c373964dc6be6ff
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: euclidier
      license: MIT
      about: 8-lane Euclidean MIDI note/CC sequencer that drives other tracks over MIDI.
      dry_run: ${{ inputs.dry_run }}
